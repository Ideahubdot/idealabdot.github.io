<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Wave Simulator</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, Arial, sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        overflow-x: hidden;
    }
    .topbar {
        padding: 10px 14px 0 14px;
        font-weight: bold;
    }
    .eq {
        text-align: center;
        font-size: 16px;
        font-family: "Times New Roman", serif;
        padding: 6px 0 8px 0;
        color: #1a56db;
    }
    .hint {
        text-align: center;
        font-size: 12px;
        color: #888;
        padding-bottom: 6px;
    }
    #sceneWrap {
        width: 100%;
        height: 380px;
        position: relative;
        background: linear-gradient(#eef2f7, #ffffff);
        touch-action: none;
    }
    #loadingMsg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #999;
        font-size: 13px;
    }
    canvas { display: block; }
    .panel {
        padding: 14px 16px 8px 16px;
        border-top: 1px solid #e5e7eb;
    }
    .row {
        display: grid;
        grid-template-columns: 92px 1fr 62px;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
    }
    .row label {
        font-size: 14px;
        font-weight: 600;
        color: #333;
    }
    .row .val {
        font-family: monospace;
        font-size: 14px;
        color: #444;
        text-align: right;
    }
    input[type=range] {
        width: 100%;
        accent-color: #1a56db;
    }
    .buttons {
        display: flex;
        gap: 10px;
        margin: 8px 0 16px 0;
    }
    button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #1a56db;
        color: white;
        font-size: 14px;
        cursor: pointer;
    }
    button.secondary {
        background: #e5e7eb;
        color: #222;
    }
    .info {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 0 16px 20px 16px;
    }
    .infoBox {
        background: #f7f8fa;
        border-radius: 10px;
        padding: 10px;
        text-align: center;
    }
    .infoBox span {
        display: block;
        color: #666;
        font-size: 12px;
    }
    .infoBox strong {
        display: block;
        margin-top: 4px;
        font-size: 16px;
        font-family: monospace;
    }
    hr.sep {
        border: 0;
        border-top: 1px solid #e5e7eb;
        margin: 4px 0 14px 0;
    }
    .legend {
        display: flex;
        justify-content: center;
        gap: 16px;
        font-size: 12px;
        padding-bottom: 8px;
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<div class="topbar">3D Wave Simulator</div>
<div class="eq" id="eqDisplay">y = A sin(kx &minus; &omega;t + &phi;)</div>
<div class="legend">
    <span><i class="dot" style="background:#e11d48"></i>X (propagation)</span>
    <span><i class="dot" style="background:#16a34a"></i>Y (displacement)</span>
    <span><i class="dot" style="background:#2563eb"></i>Z (depth)</span>
</div>
<div class="hint">Drag to rotate &nbsp;•&nbsp; Scroll / pinch to zoom</div>

<div id="sceneWrap"><div id="loadingMsg">Loading 3D engine…</div></div>

<div class="panel">

    <div class="row">
        <label>Amplitude A</label>
        <input type="range" id="amp" min="0.2" max="3" step="0.1" value="1">
        <span class="val" id="ampVal">1.0</span>
    </div>

    <div class="row">
        <label>Wavelength λ</label>
        <input type="range" id="wavelength" min="0.5" max="8" step="0.1" value="4">
        <span class="val" id="wavelengthVal">4.0</span>
    </div>

    <div class="row">
        <label>Frequency f</label>
        <input type="range" id="freq" min="0" max="2" step="0.05" value="0.5">
        <span class="val" id="freqVal">0.50</span>
    </div>

    <div class="row">
        <label>Phase φ</label>
        <input type="range" id="phase" min="-6.3" max="6.3" step="0.1" value="0">
        <span class="val" id="phaseVal">0.0</span>
    </div>

    <hr class="sep">

    <div class="row">
        <label>Time t</label>
        <input type="range" id="time" min="0" max="10" step="0.05" value="0">
        <span class="val" id="timeVal">0.00</span>
    </div>

    <div class="buttons">
        <button id="playBtn">⏸ Pause</button>
        <button class="secondary" id="resetBtn">↻ Reset</button>
    </div>

</div>

<div class="info">
    <div class="infoBox">
        <span>Wave number k = 2π/λ</span>
        <strong id="kVal">1.571</strong>
    </div>
    <div class="infoBox">
        <span>Angular freq ω = 2πf</span>
        <strong id="omegaVal">3.142</strong>
    </div>
    <div class="infoBox">
        <span>Period T = 1/f</span>
        <strong id="periodVal">2.00 s</strong>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {

if (typeof THREE === 'undefined') {
    document.getElementById('loadingMsg').textContent =
        '3D engine failed to load. Check your internet connection and reload.';
    return;
}
document.getElementById('loadingMsg').remove();

// ---------- UI elements ----------
const ampInput = document.getElementById('amp');
const wavelengthInput = document.getElementById('wavelength');
const freqInput = document.getElementById('freq');
const phaseInput = document.getElementById('phase');
const timeInput = document.getElementById('time');

const ampVal = document.getElementById('ampVal');
const wavelengthVal = document.getElementById('wavelengthVal');
const freqVal = document.getElementById('freqVal');
const phaseVal = document.getElementById('phaseVal');
const timeVal = document.getElementById('timeVal');

const kVal = document.getElementById('kVal');
const omegaVal = document.getElementById('omegaVal');
const periodVal = document.getElementById('periodVal');
const eqDisplay = document.getElementById('eqDisplay');

const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const wrap = document.getElementById('sceneWrap');

// ---------- Three.js setup ----------
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, wrap.clientWidth / wrap.clientHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.setClearColor(0xffffff, 0);
wrap.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(4, 6, 5);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.35);
dirLight2.position.set(-4, 3, -5);
scene.add(dirLight2);

// ---------- Axes with colored lines + text labels (both + and − sides) ----------
const AXIS_LEN = 6.5;

function makeAxisLine(dir, color) {
    // Full line through the origin, from -AXIS_LEN to +AXIS_LEN along dir
    const points = [
        dir.clone().multiplyScalar(-AXIS_LEN),
        dir.clone().multiplyScalar(AXIS_LEN)
    ];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
    return new THREE.Line(geo, mat);
}
scene.add(makeAxisLine(new THREE.Vector3(1, 0, 0), 0xe11d48)); // X red
scene.add(makeAxisLine(new THREE.Vector3(0, 1, 0), 0x16a34a)); // Y green
scene.add(makeAxisLine(new THREE.Vector3(0, 0, 1), 0x2563eb)); // Z blue

function makeTextSprite(text, hexColor) {
    const canvasEl = document.createElement('canvas');
    canvasEl.width = 128;
    canvasEl.height = 128;
    const c = canvasEl.getContext('2d');
    c.fillStyle = hexColor;
    c.font = 'bold 80px Arial';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(text, 64, 64);
    const texture = new THREE.CanvasTexture(canvasEl);
    const mat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(0.7, 0.7, 0.7);
    return sprite;
}

// Positive-end labels
const labelX = makeTextSprite('X', '#e11d48');
labelX.position.set(AXIS_LEN + 0.4, 0, 0);
scene.add(labelX);

const labelY = makeTextSprite('Y', '#16a34a');
labelY.position.set(0, AXIS_LEN + 0.4, 0);
scene.add(labelY);

const labelZ = makeTextSprite('Z', '#2563eb');
labelZ.position.set(0, 0, AXIS_LEN + 0.4);
scene.add(labelZ);

// Negative-end labels
const labelXNeg = makeTextSprite('-X', '#e11d48');
labelXNeg.position.set(-AXIS_LEN - 0.5, 0, 0);
scene.add(labelXNeg);

const labelYNeg = makeTextSprite('-Y', '#16a34a');
labelYNeg.position.set(0, -AXIS_LEN - 0.5, 0);
scene.add(labelYNeg);

const labelZNeg = makeTextSprite('-Z', '#2563eb');
labelZNeg.position.set(0, 0, -AXIS_LEN - 0.5);
scene.add(labelZNeg);

// Small tick marks + numeric labels along each axis (every 2 units, skip 0)
function makeTick(pos, color) {
    const geo = new THREE.SphereGeometry(0.05, 8, 8);
    const mat = new THREE.MeshBasicMaterial({ color: color });
    const dot = new THREE.Mesh(geo, mat);
    dot.position.copy(pos);
    return dot;
}
for (let v = -6; v <= 6; v += 2) {
    if (v === 0) continue;
    scene.add(makeTick(new THREE.Vector3(v, 0, 0), 0xe11d48));
    scene.add(makeTick(new THREE.Vector3(0, v, 0), 0x16a34a));
    scene.add(makeTick(new THREE.Vector3(0, 0, v), 0x2563eb));
}

// Ground grid for spatial reference — centered at origin, so it shows
// both negative and positive X/Z by default
const grid = new THREE.GridHelper(13, 26, 0xd0d5db, 0xe8ebef);
grid.position.y = -3;
scene.add(grid);

// ---------- Wave surface geometry ----------
const PLANE_LENGTH = 12;   // along X (propagation direction)
const PLANE_DEPTH = 6;     // along Z
const SEG_X = 80;
const SEG_Z = 14;

const geometry = new THREE.PlaneGeometry(PLANE_LENGTH, PLANE_DEPTH, SEG_X, SEG_Z);
geometry.rotateX(-Math.PI / 2); // lay flat in XZ plane; Y becomes vertical displacement

const vertCount = geometry.attributes.position.count;
const colors = new Float32Array(vertCount * 3);
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.MeshPhongMaterial({
    vertexColors: true,
    shininess: 50,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.92
});
const waveMesh = new THREE.Mesh(geometry, material);
scene.add(waveMesh);

// Wireframe overlay (built once on the flat geometry footprint; positions synced per-frame below)
const wireMat = new THREE.LineBasicMaterial({ color: 0x0d3aa6, transparent: true, opacity: 0.15 });
let wireframe = new THREE.LineSegments(new THREE.WireframeGeometry(geometry), wireMat);
scene.add(wireframe);

// Highlighted curve along Z=0 — the classic 2D sine slice
const sliceCount = SEG_X + 1;
const sliceGeo = new THREE.BufferGeometry();
const slicePositions = new Float32Array(sliceCount * 3);
sliceGeo.setAttribute('position', new THREE.BufferAttribute(slicePositions, 3));
const sliceMat = new THREE.LineBasicMaterial({ color: 0xff5a3c, linewidth: 3 });
const sliceLine = new THREE.Line(sliceGeo, sliceMat);
scene.add(sliceLine);

// Traveling marker dot on the slice curve
const markerGeo = new THREE.SphereGeometry(0.14, 16, 16);
const markerMat = new THREE.MeshPhongMaterial({ color: 0xff5a3c });
const marker = new THREE.Mesh(markerGeo, markerMat);
scene.add(marker);

// ---------- Manual orbit camera (no external OrbitControls dependency) ----------
let camTheta = Math.PI / 4;
let camPhi = 1.15;
let camRadius = 21;
const target = new THREE.Vector3(0, 0, 0);

function updateCamera() {
    const clampedPhi = Math.max(0.2, Math.min(Math.PI - 0.2, camPhi));
    camera.position.x = target.x + camRadius * Math.sin(clampedPhi) * Math.sin(camTheta);
    camera.position.y = target.y + camRadius * Math.cos(clampedPhi);
    camera.position.z = target.z + camRadius * Math.sin(clampedPhi) * Math.cos(camTheta);
    camera.lookAt(target);
}
updateCamera();

let isDragging = false;
let lastX = 0, lastY = 0;

function pointerDown(x, y) { isDragging = true; lastX = x; lastY = y; }
function pointerMove(x, y) {
    if (!isDragging) return;
    const dx = x - lastX;
    const dy = y - lastY;
    lastX = x; lastY = y;
    camTheta -= dx * 0.006;
    camPhi -= dy * 0.006;
    updateCamera();
}
function pointerUp() { isDragging = false; }

renderer.domElement.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
window.addEventListener('mouseup', pointerUp);

renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 1) pointerDown(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
    if (e.touches.length === 1) pointerMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
renderer.domElement.addEventListener('touchend', pointerUp);

renderer.domElement.addEventListener('wheel', e => {
    e.preventDefault();
    camRadius = Math.max(8, Math.min(40, camRadius + e.deltaY * 0.01));
    updateCamera();
}, { passive: false });

let pinchStartDist = null;
let pinchStartRadius = camRadius;
renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.sqrt(dx * dx + dy * dy);
        pinchStartRadius = camRadius;
    }
}, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDist) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        camRadius = Math.max(8, Math.min(40, pinchStartRadius * (pinchStartDist / dist)));
        updateCamera();
    }
}, { passive: true });

// ---------- Resize handling ----------
function resize() {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
}
window.addEventListener('resize', resize);

// ---------- Wave update ----------
const posAttr = geometry.attributes.position;
const baseX = new Float32Array(posAttr.count);
for (let i = 0; i < posAttr.count; i++) baseX[i] = posAttr.getX(i);

const wirePosAttr = wireframe.geometry.attributes.position;
// Map each wireframe vertex back to nearest surface vertex by matching X (and Z) once — simpler:
// rebuild wireframe geometry from the (already displaced) surface geometry each update.

function updateWave() {
    const A = parseFloat(ampInput.value);
    const lambda = parseFloat(wavelengthInput.value);
    const f = parseFloat(freqInput.value);
    const phi = parseFloat(phaseInput.value);
    const t = parseFloat(timeInput.value);

    const k = 2 * Math.PI / lambda;
    const omega = 2 * Math.PI * f;
    const period = f === 0 ? Infinity : 1 / f;

    ampVal.textContent = A.toFixed(1);
    wavelengthVal.textContent = lambda.toFixed(1);
    freqVal.textContent = f.toFixed(2);
    phaseVal.textContent = phi.toFixed(1);
    timeVal.textContent = t.toFixed(2);
    kVal.textContent = k.toFixed(3);
    omegaVal.textContent = omega.toFixed(3);
    periodVal.textContent = period === Infinity ? "∞" : period.toFixed(2) + " s";
    eqDisplay.innerHTML = `y = ${A.toFixed(1)} sin(kx &minus; &omega;t + &phi;)`;

    const colorAttr = geometry.attributes.color;
    const maxA = Math.max(A, 0.001);

    for (let i = 0; i < posAttr.count; i++) {
        const x = baseX[i];
        const y = A * Math.sin(k * x - omega * t + phi);
        posAttr.setY(i, y);

        const norm = (y / maxA + 1) / 2; // 0..1
        colorAttr.setXYZ(i, 0.1 + norm * 0.85, 0.33 + norm * 0.25, 0.86 - norm * 0.55);
    }
    posAttr.needsUpdate = true;
    colorAttr.needsUpdate = true;
    geometry.computeVertexNormals();

    // Rebuild wireframe to follow the deformed surface
    wireframe.geometry.dispose();
    wireframe.geometry = new THREE.WireframeGeometry(geometry);

    // Highlighted Z=0 slice + marker
    for (let i = 0; i < sliceCount; i++) {
        const x = -PLANE_LENGTH / 2 + (i / (sliceCount - 1)) * PLANE_LENGTH;
        const y = A * Math.sin(k * x - omega * t + phi);
        slicePositions[i * 3] = x;
        slicePositions[i * 3 + 1] = y + 0.02; // tiny lift to avoid z-fighting with surface
        slicePositions[i * 3 + 2] = 0;
    }
    sliceGeo.attributes.position.needsUpdate = true;
    sliceGeo.computeBoundingSphere();

    const markerY = A * Math.sin(k * 0 - omega * t + phi);
    marker.position.set(0, markerY + 0.02, 0);
}

// ---------- Animation loop (fixed-step, reliable) ----------
let animating = true;
let intervalId = null;
const TICK_MS = 40;
const STEP = 0.05;

function tick() {
    if (!animating) return;
    let newT = parseFloat(timeInput.value) + STEP;
    const maxT = parseFloat(timeInput.max);
    if (newT > maxT) newT = parseFloat(timeInput.min);
    timeInput.value = newT.toFixed(2);
    updateWave();
}

function startAnimating() {
    animating = true;
    playBtn.textContent = "⏸ Pause";
    if (intervalId) clearInterval(intervalId);
    intervalId = setInterval(tick, TICK_MS);
}
function stopAnimating() {
    animating = false;
    playBtn.textContent = "▶ Play";
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
}

playBtn.addEventListener('click', () => { animating ? stopAnimating() : startAnimating(); });

resetBtn.addEventListener('click', () => {
    ampInput.value = 1;
    wavelengthInput.value = 4;
    freqInput.value = 0.5;
    phaseInput.value = 0;
    timeInput.value = 0;
    camTheta = Math.PI / 4;
    camPhi = 1.15;
    camRadius = 21;
    updateCamera();
    updateWave();
});

timeInput.addEventListener('pointerdown', stopAnimating);

[ampInput, wavelengthInput, freqInput, phaseInput, timeInput].forEach(inp => {
    inp.addEventListener('input', updateWave);
});

// ---------- Render loop ----------
function renderLoop() {
    renderer.render(scene, camera);
    requestAnimationFrame(renderLoop);
}

resize();
updateWave();
startAnimating();
renderLoop();

})();
</script>

</body>
</html>
